<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket 24/7 - Delivery Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. CABECERA Y AVISO DE HORARIO / COBERTURA -->
    <header class="cabecera">
        <div class="logo-estado">
            <h1>🛒 Minimarket 24h</h1>
            <span id="badge-horario" class="estado-abierto">Abierto 24/7</span>
        </div>
        <p id="aviso-cobertura" class="aviso-delivery">
            🛵 Delivery activo en toda la ciudad
        </p>

        <!-- Buscador rápido estilo App -->
        <div class="buscador">
            <input type="text" id="input-buscar" placeholder="¿Qué te provoca hoy? (Ej. Helado, Harina, Refresco...)">
        </div>
    </header>

    <!-- 2. BOTONES DE CATEGORÍAS -->
    <nav class="categorias">
        <button class="btn-cat activo" data-categoria="todos">🔥 Todo</button>
        <button class="btn-cat" data-categoria="antojos">🍫 Antojos y Helados</button>
        <button class="btn-cat" data-categoria="bebidas">🥤 Bebidas</button>
        <button class="btn-cat" data-categoria="despensa">🥫 Almuerzo y Despensa</button>
    </nav>

    <!-- 3. CATÁLOGO DE PRODUCTOS -->
    <main class="contenedor-productos" id="lista-productos">
        <div class="tarjeta-producto">
            <div class="icono-prod">🍦</div>
            <h3>Helado Mantecado 1L</h3>
            <p class="precio">$4.50</p>
            <button class="btn-agregar">+ Agregar</button>
        </div>

        <div class="tarjeta-producto">
            <div class="icono-prod">🍫</div>
            <h3>Chocolate con Leche</h3>
            <p class="precio">$1.50</p>
            <button class="btn-agregar">+ Agregar</button>
        </div>

        <div class="tarjeta-producto">
            <div class="icono-prod">🍚</div>
            <h3>Harina de Maíz 1Kg</h3>
            <p class="precio">$1.20</p>
            <button class="btn-agregar">+ Agregar</button>
        </div>

        <div class="tarjeta-producto">
            <div class="icono-prod">🥤</div>
            <h3>Refresco Cola 2L</h3>
            <p class="precio">$2.20</p>
            <button class="btn-agregar">+ Agregar</button>
        </div>
    </main>

    <!-- 4. BARRA FLOTANTE DEL CARRITO -->
    <footer class="barra-carrito">
        <div class="info-carrito">
            <span id="cantidad-carrito">0 productos</span>
            <strong id="total-carrito">Total: $0.00</strong>
        </div>
        <button id="btn-ver-carrito" class="btn-pagar">Ver Carrito y Pagar ➔</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
